<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tachkila</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header class="bg-[#1E293B] text-white lg:grid lg:grid-cols-3 lg:h-20">
      <div>
        <img src="" alt="" />
        <div class="m-5">
          <h3>TACHKILA</h3>
          <p class="text-gray-400 text-xs">ATLAS FC</p>
        </div>
      </div>
      <nav class="bg-[#0F172A] rounded-2xl">
        <ul class="grid grid-cols-3">
          <li><a href="index.html" class="m-5">Effectif</a></li>
          <li><a href="composition.html" class="m-5 ">Composition</a></li>
          <li><a href="matchs.html" class="m-5 bg-green-600 rounded-2xl">Matchs</a></li>
        </ul>
      </nav>
      <div>
        <div class="flex gap-2 justify-center items-center">
          <div class="w-2 h-2 bg-yellow-300 rounded-full"></div>
          <p class="text-yellow-300 mr-5">GB</p>
          <div class="w-2 h-2 bg-blue-600 rounded-full"></div>
          <p class="text-blue-600 mr-5">DEF</p>
          <div class="w-2 h-2 bg-green-600 rounded-full"></div>
          <p class="text-green-600 mr-5">MIL</p>
          <div class="w-2 h-2 bg-red-600 rounded-full"></div>
          <p class="text-red-600 mr-5">ATT</p>
        </div>
      </div>
    </header>
    <main class="lg:grid lg:grid-cols-4 lg:min-h-screen">
      <aside class="bg-[#1E293B] text-white grid grid-rows-3" id="aside">
        <div class="flex justify-between m-3">
          <p>effectif</p>
          <div class="bg-gray-500 rounded-2xl">
            <div id="playersn" class="text-left lg;h-2">0 joueur(s)</div>
          </div>
        </div>
        <div class="p-2">
          <p>
            cliquez sur un joueur placé pour voir sa case sur le terrain. pour
            modifier, pour supprimer.
          </p>
        </div>

        <div id="player-card"></div>
      </aside>
      <div class="lg:grid lg:col-start-2 lg:col-end-5 bg-[#0F172A]">
        <section class="lg:grid lg:grid-cols-12 max-sm:grid max-sm:grid-cols-12">
          <div class="lg:col-start-1 lg:col-span-1 lg:w-12 lg:h-12 bg-red rounded-2xl"></div>
          <div class="col-start-2 col-span-1 w-12 h-12 bg-red rounded-2xl"></div>
          <div class="col-start-3 col-span-1 w-12 h-12 bg-red rounded-2xl"></div>
        </section>
      </div>
    </main>
  </body>
</html>
